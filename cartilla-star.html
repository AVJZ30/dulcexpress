<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cartilla Star · DulceXpress</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">

<!-- ============================================================
     CONFIGURA AQUÍ TU PROYECTO DE SUPABASE
     ============================================================ -->
<script>
  window.SUPABASE_URL = "https://TU-PROYECTO.supabase.co";
  window.SUPABASE_ANON_KEY = "TU-ANON-KEY-PUBLICA";
</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  :root{
    --cafe-mas-oscuro:#1F1308; --cafe-oscuro:#3E2A1F; --cafe-intenso:#4F2F1C;
    --cafe-medio:#5E3A2C; --cafe-capuchino:#8B5E3C; --cafe-lechoso:#B28B6F;
    --cafe-claro:#D9C2A7; --cafe-crema:#F2E4D5; --dorado-suave:#E0B07F;
    --bg-primary:#FBF6EF; --bg-secondary:#F6EDE3; --text-primary:#2C1A0E;
    --text-secondary:#4F2F1C; --card-bg:#FFF8F0; --ok:#5C7A4F; --error:#B0403A;
  }
  body{
    font-family:'Plus Jakarta Sans', sans-serif;
    background:var(--bg-primary);
    color:var(--text-primary);
    min-height:100vh;
    padding-bottom:60px;
  }
  header{
    background:var(--cafe-mas-oscuro);
    padding:22px 20px;
    text-align:center;
    border-bottom:4px solid var(--dorado-suave);
  }
  header h1{
    font-size:1.7rem;
    font-weight:800;
    color:#F5E6D6;
    letter-spacing:0.3px;
  }
  header h1 i{ color:var(--dorado-suave); margin-right:8px; }
  header p{ color:var(--cafe-claro); font-size:0.85rem; margin-top:4px; }

  .tabs{
    display:flex;
    max-width:480px;
    margin:24px auto 0;
    background:var(--card-bg);
    border-radius:14px;
    padding:5px;
    box-shadow:0 4px 14px rgba(0,0,0,0.06);
  }
  .tab-btn{
    flex:1;
    border:none;
    background:transparent;
    padding:12px;
    font-weight:700;
    font-size:0.95rem;
    color:var(--text-secondary);
    border-radius:10px;
    cursor:pointer;
    transition:all .2s;
  }
  .tab-btn.active{ background:var(--cafe-oscuro); color:#fff; }

  .view{ display:none; max-width:480px; margin:24px auto; padding:0 18px; }
  .view.active{ display:block; }

  .card{
    background:var(--card-bg);
    border-radius:18px;
    padding:24px;
    box-shadow:0 6px 20px rgba(0,0,0,0.06);
    margin-bottom:20px;
  }
  .card h2{ font-size:1.2rem; margin-bottom:14px; color:var(--cafe-oscuro); }
  .card h2 i{ color:var(--dorado-suave); margin-right:6px; }

  label{ font-size:0.82rem; font-weight:600; color:var(--text-secondary); display:block; margin-bottom:5px; }
  input, select{
    width:100%;
    padding:12px 14px;
    border-radius:10px;
    border:1.5px solid var(--cafe-claro);
    margin-bottom:14px;
    font-size:0.95rem;
    font-family:inherit;
    background:#fff;
    color:var(--text-primary);
  }
  input:focus, select:focus{ outline:none; border-color:var(--cafe-capuchino); }

  .btn{
    width:100%;
    padding:13px;
    border:none;
    border-radius:40px;
    background:var(--cafe-oscuro);
    color:#fff;
    font-weight:700;
    font-size:0.95rem;
    cursor:pointer;
    transition:transform .15s, background .2s;
    display:flex; align-items:center; justify-content:center; gap:8px;
  }
  .btn:hover{ background:var(--cafe-intenso); transform:translateY(-1px); }
  .btn:disabled{ opacity:0.55; cursor:not-allowed; transform:none; }
  .btn-secondary{ background:transparent; border:2px solid var(--cafe-medio); color:var(--cafe-medio); }
  .btn-secondary:hover{ background:var(--cafe-crema); }
  .btn-small{ width:auto; padding:8px 16px; font-size:0.82rem; border-radius:30px; }

  .stars-row{
    display:flex; flex-wrap:wrap; gap:10px; justify-content:center;
    margin:18px 0;
  }
  .star-slot{
    width:42px; height:42px;
    border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    font-size:1.3rem;
    background:var(--cafe-crema);
    color:var(--cafe-claro);
    border:2px solid var(--cafe-claro);
    transition:all .25s;
  }
  .star-slot.filled{
    background:var(--dorado-suave);
    color:var(--cafe-mas-oscuro);
    border-color:var(--cafe-capuchino);
    transform:scale(1.05);
  }
  .progreso-txt{ text-align:center; font-weight:700; color:var(--cafe-oscuro); margin-bottom:4px; }
  .progreso-sub{ text-align:center; font-size:0.82rem; color:var(--text-secondary); margin-bottom:6px; }

  .banner-lista{
    background:linear-gradient(135deg, #C97E4A, #8B4513);
    color:#fff;
    padding:16px;
    border-radius:14px;
    text-align:center;
    font-weight:700;
    margin-bottom:16px;
  }
  .banner-lista i{ margin-right:6px; }

  .producto-item{
    display:flex; align-items:center; gap:12px;
    padding:12px;
    border:1.5px solid var(--cafe-claro);
    border-radius:12px;
    margin-bottom:10px;
    cursor:pointer;
    transition:all .2s;
  }
  .producto-item.selected{ border-color:var(--cafe-capuchino); background:var(--cafe-crema); }
  .producto-item .emoji{ font-size:1.6rem; }
  .producto-item .info h4{ font-size:0.95rem; color:var(--text-primary); }
  .producto-item .info p{ font-size:0.78rem; color:var(--text-secondary); }

  .historial-item{
    display:flex; justify-content:space-between; align-items:center;
    padding:10px 0; border-bottom:1px solid var(--cafe-crema);
    font-size:0.88rem;
  }
  .historial-item:last-child{ border-bottom:none; }
  .historial-item .fecha{ color:var(--text-secondary); font-size:0.78rem; }

  .msg{
    padding:12px 14px; border-radius:10px; font-size:0.88rem; font-weight:600;
    margin-bottom:14px; display:none;
  }
  .msg.show{ display:block; }
  .msg.ok{ background:#E9F0E5; color:var(--ok); }
  .msg.error{ background:#F6E4E2; color:var(--error); }

  .resultado-cliente{
    display:flex; justify-content:space-between; align-items:center;
    padding:12px; border:1.5px solid var(--cafe-claro); border-radius:12px; margin-bottom:10px;
  }
  .resultado-cliente .datos h4{ font-size:0.92rem; }
  .resultado-cliente .datos p{ font-size:0.78rem; color:var(--text-secondary); }

  .empty-state{ text-align:center; color:var(--text-secondary); font-size:0.88rem; padding:20px 0; }
  .hidden{ display:none !important; }

  .top-bar-admin{ display:flex; justify-content:space-between; align-items:center; margin-bottom:14px; }
  .top-bar-admin span{ font-size:0.85rem; color:var(--text-secondary); }
</style>
</head>
<body>

<header>
  <h1 id="logo-secreto"><i class="fas fa-star"></i>Cartilla Star</h1>
  <p>El programa de fidelidad de DulceXpress</p>
</header>

<div class="tabs" id="tabs" style="display:none;">
  <button class="tab-btn active" data-tab="cliente">Soy cliente</button>
  <button class="tab-btn" data-tab="admin">Panel admin</button>
</div>

<!-- ============ VISTA CLIENTE ============ -->
<div class="view active" id="view-cliente">

  <div class="card">
    <h2><i class="fas fa-envelope"></i>Ver mi cartilla</h2>
    <div class="msg" id="msg-cliente-login"></div>
    <label for="c-nombre">Tu nombre (solo la primera vez)</label>
    <input id="c-nombre" type="text" placeholder="Ej: María González">
    <label for="c-email">Tu correo electrónico</label>
    <input id="c-email" type="email" placeholder="tucorreo@ejemplo.com">
    <button class="btn" id="btn-ver-cartilla"><i class="fas fa-id-card"></i> Ver mi cartilla</button>
  </div>

  <div class="card hidden" id="card-cartilla">
    <h2><i class="fas fa-star"></i>Mi cartilla</h2>
    <p class="progreso-sub" id="cartilla-nombre"></p>
    <div class="progreso-txt" id="progreso-txt"></div>
    <div class="stars-row" id="stars-row"></div>

    <div id="zona-premio" class="hidden">
      <div class="banner-lista"><i class="fas fa-gift"></i> ¡Cartilla completa! Elige tu premio</div>
      <div id="lista-productos"></div>
      <button class="btn" id="btn-canjear" disabled><i class="fas fa-check"></i> Canjear premio</button>
      <div class="msg" id="msg-canje"></div>
    </div>

    <button class="btn btn-secondary" id="btn-ver-historial" style="margin-top:14px;">
      <i class="fas fa-clock-rotate-left"></i> Ver mi historial de canjes
    </button>
    <div id="lista-historial" style="margin-top:14px;"></div>
  </div>

</div>

<!-- ============ VISTA ADMIN ============ -->
<div class="view" id="view-admin">

  <div class="card" id="card-admin-login">
    <h2><i class="fas fa-lock"></i>Acceso administrador</h2>
    <div class="msg" id="msg-admin-login"></div>
    <label for="a-email">Correo del administrador</label>
    <input id="a-email" type="email" placeholder="admin@dulcexpress.com">
    <label for="a-pass">Contraseña</label>
    <input id="a-pass" type="password" placeholder="••••••••">
    <button class="btn" id="btn-admin-login"><i class="fas fa-right-to-bracket"></i> Ingresar</button>
    <p style="font-size:0.75rem; color:var(--text-secondary); margin-top:10px;">
      El usuario administrador se crea desde el panel de Supabase (Authentication) y debe registrarse en la tabla <code>admins</code>. Ver instrucciones SQL.
    </p>
  </div>

  <div class="card hidden" id="card-admin-panel">
    <div class="top-bar-admin">
      <span id="admin-user-label"></span>
      <button class="btn btn-secondary btn-small" id="btn-admin-logout">Cerrar sesión</button>
    </div>
    <h2><i class="fas fa-magnifying-glass"></i>Buscar cliente</h2>
    <input id="admin-buscar" type="text" placeholder="Buscar por correo electrónico">
    <button class="btn" id="btn-admin-buscar"><i class="fas fa-search"></i> Buscar</button>
    <div class="msg" id="msg-admin-buscar"></div>
    <div id="resultados-admin" style="margin-top:14px;"></div>
  </div>

</div>

<script>
(function(){
  const supabase = window.supabase.createClient(window.SUPABASE_URL, window.SUPABASE_ANON_KEY);
  let ESTRELLAS_REQUERIDAS = 8;
  let clienteActual = null;
  let productoSeleccionado = null;

  // ---------- utilidades ----------
  function showMsg(el, text, type){
    el.textContent = text;
    el.className = 'msg show ' + type;
  }
  function hideMsg(el){ el.className = 'msg'; }

  // ---------- acceso oculto al panel admin ----------
  // 1) entrando con ?admin al final de la URL, o
  // 2) tocando 5 veces seguidas el título "Cartilla Star".
  function activarAcceso(){
    document.getElementById('tabs').style.display = 'flex';
    document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
    document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
    document.querySelector('.tab-btn[data-tab="admin"]').classList.add('active');
    document.getElementById('view-admin').classList.add('active');
  }
  if(new URLSearchParams(window.location.search).has('admin')){
    activarAcceso();
  }
  let toques = 0, ultimoToque = 0;
  document.getElementById('logo-secreto').addEventListener('click', ()=>{
    const ahora = Date.now();
    toques = (ahora - ultimoToque < 800) ? toques + 1 : 1;
    ultimoToque = ahora;
    if(toques >= 5){ toques = 0; activarAcceso(); }
  });

  // ---------- tabs ----------
  document.querySelectorAll('.tab-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
      document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
      btn.classList.add('active');
      document.getElementById('view-'+btn.dataset.tab).classList.add('active');
    });
  });

  // ---------- cargar configuración ----------
  async function cargarConfig(){
    const { data } = await supabase.from('configuracion').select('estrellas_requeridas').eq('id',1).single();
    if(data) ESTRELLAS_REQUERIDAS = data.estrellas_requeridas;
  }
  cargarConfig();

  // ---------- CLIENTE: ver cartilla ----------
  const msgClienteLogin = document.getElementById('msg-cliente-login');
  document.getElementById('btn-ver-cartilla').addEventListener('click', async ()=>{
    hideMsg(msgClienteLogin);
    const email = document.getElementById('c-email').value.trim().toLowerCase();
    const nombre = document.getElementById('c-nombre').value.trim() || 'Cliente';
    if(!email){ showMsg(msgClienteLogin, 'Ingresa tu correo electrónico.', 'error'); return; }

    const { data: registro, error: errReg } = await supabase.rpc('registrar_cliente', { p_email: email, p_nombre: nombre });
    if(errReg){ showMsg(msgClienteLogin, 'No se pudo registrar: ' + errReg.message, 'error'); return; }

    const { data: cartilla, error: errCart } = await supabase.rpc('obtener_cartilla', { p_email: email });
    if(errCart || !cartilla || !cartilla.length){ showMsg(msgClienteLogin, 'No se pudo cargar tu cartilla.', 'error'); return; }

    clienteActual = cartilla[0];
    ESTRELLAS_REQUERIDAS = clienteActual.estrellas_requeridas;
    renderCartilla();
    document.getElementById('card-cartilla').classList.remove('hidden');
    document.getElementById('lista-historial').innerHTML = '';
  });

  function renderCartilla(){
    document.getElementById('cartilla-nombre').textContent = clienteActual.nombre + ' · ' + clienteActual.email;
    document.getElementById('progreso-txt').textContent = clienteActual.estrellas + ' / ' + ESTRELLAS_REQUERIDAS + ' estrellas';

    const row = document.getElementById('stars-row');
    row.innerHTML = '';
    for(let i=1; i<=ESTRELLAS_REQUERIDAS; i++){
      const slot = document.createElement('div');
      slot.className = 'star-slot' + (i <= clienteActual.estrellas ? ' filled' : '');
      slot.innerHTML = '<i class="fas fa-star"></i>';
      row.appendChild(slot);
    }

    const zonaPremio = document.getElementById('zona-premio');
    if(clienteActual.estrellas >= ESTRELLAS_REQUERIDAS){
      zonaPremio.classList.remove('hidden');
      cargarProductos();
    } else {
      zonaPremio.classList.add('hidden');
    }
  }

  async function cargarProductos(){
    const { data, error } = await supabase.from('productos_canje').select('*').eq('activo', true).order('nombre');
    const cont = document.getElementById('lista-productos');
    cont.innerHTML = '';
    productoSeleccionado = null;
    document.getElementById('btn-canjear').disabled = true;
    if(error || !data || !data.length){
      cont.innerHTML = '<p class="empty-state">No hay premios disponibles por ahora.</p>';
      return;
    }
    data.forEach(p=>{
      const item = document.createElement('div');
      item.className = 'producto-item';
      item.innerHTML = `<div class="emoji">${p.emoji || '🎁'}</div>
        <div class="info"><h4>${p.nombre}</h4><p>${p.descripcion || ''}</p></div>`;
      item.addEventListener('click', ()=>{
        document.querySelectorAll('.producto-item').forEach(i=>i.classList.remove('selected'));
        item.classList.add('selected');
        productoSeleccionado = p.id;
        document.getElementById('btn-canjear').disabled = false;
      });
      cont.appendChild(item);
    });
  }

  const msgCanje = document.getElementById('msg-canje');
  document.getElementById('btn-canjear').addEventListener('click', async ()=>{
    hideMsg(msgCanje);
    if(!productoSeleccionado || !clienteActual) return;
    const { data, error } = await supabase.rpc('canjear_premio', { p_email: clienteActual.email, p_producto_id: productoSeleccionado });
    if(error || !data || !data.length || !data[0].ok){
      showMsg(msgCanje, (data && data[0] && data[0].mensaje) || (error && error.message) || 'No se pudo canjear.', 'error');
      return;
    }
    showMsg(msgCanje, '¡Premio canjeado! Tu cartilla se reinició.', 'ok');
    const { data: cartilla } = await supabase.rpc('obtener_cartilla', { p_email: clienteActual.email });
    if(cartilla && cartilla.length) clienteActual = cartilla[0];
    renderCartilla();
  });

  document.getElementById('btn-ver-historial').addEventListener('click', async ()=>{
    if(!clienteActual) return;
    const { data, error } = await supabase.rpc('obtener_historial', { p_email: clienteActual.email });
    const cont = document.getElementById('lista-historial');
    if(error){ cont.innerHTML = '<p class="empty-state">No se pudo cargar el historial.</p>'; return; }
    if(!data || !data.length){ cont.innerHTML = '<p class="empty-state">Aún no has canjeado premios.</p>'; return; }
    cont.innerHTML = data.map(h=>{
      const f = new Date(h.fecha);
      return `<div class="historial-item"><span>${h.producto_nombre}</span><span class="fecha">${f.toLocaleDateString()}</span></div>`;
    }).join('');
  });

  // ---------- ADMIN: login ----------
  const msgAdminLogin = document.getElementById('msg-admin-login');
  document.getElementById('btn-admin-login').addEventListener('click', async ()=>{
    hideMsg(msgAdminLogin);
    const email = document.getElementById('a-email').value.trim();
    const pass = document.getElementById('a-pass').value;
    if(!email || !pass){ showMsg(msgAdminLogin, 'Completa correo y contraseña.', 'error'); return; }
    const { data, error } = await supabase.auth.signInWithPassword({ email, password: pass });
    if(error){ showMsg(msgAdminLogin, 'Credenciales inválidas.', 'error'); return; }
    mostrarPanelAdmin(data.user.email);
  });

  function mostrarPanelAdmin(email){
    document.getElementById('card-admin-login').classList.add('hidden');
    document.getElementById('card-admin-panel').classList.remove('hidden');
    document.getElementById('admin-user-label').textContent = 'Sesión: ' + email;
  }

  document.getElementById('btn-admin-logout').addEventListener('click', async ()=>{
    await supabase.auth.signOut();
    document.getElementById('card-admin-panel').classList.add('hidden');
    document.getElementById('card-admin-login').classList.remove('hidden');
    document.getElementById('resultados-admin').innerHTML = '';
    document.getElementById('admin-buscar').value = '';
  });

  // restaurar sesión si ya estaba logueado
  supabase.auth.getSession().then(({data})=>{
    if(data && data.session) mostrarPanelAdmin(data.session.user.email);
  });

  // ---------- ADMIN: buscar y asignar estrellas ----------
  const msgAdminBuscar = document.getElementById('msg-admin-buscar');
  document.getElementById('btn-admin-buscar').addEventListener('click', async ()=>{
    hideMsg(msgAdminBuscar);
    const q = document.getElementById('admin-buscar').value.trim();
    const cont = document.getElementById('resultados-admin');
    cont.innerHTML = '';
    if(!q){ showMsg(msgAdminBuscar, 'Escribe un correo o parte de él.', 'error'); return; }

    const { data, error } = await supabase.rpc('admin_buscar_cliente', { p_email: q });
    if(error){ showMsg(msgAdminBuscar, 'Error al buscar: ' + error.message, 'error'); return; }
    if(!data || !data.length){ cont.innerHTML = '<p class="empty-state">No se encontraron clientes.</p>'; return; }

    data.forEach(c=>{
      const row = document.createElement('div');
      row.className = 'resultado-cliente';
      row.innerHTML = `
        <div class="datos">
          <h4>${c.nombre}</h4>
          <p>${c.email} · ${c.estrellas} / ${ESTRELLAS_REQUERIDAS} estrellas</p>
        </div>
        <button class="btn btn-small" data-id="${c.id}"><i class="fas fa-star"></i> +1</button>
      `;
      row.querySelector('button').addEventListener('click', async (e)=>{
        e.target.disabled = true;
        const { data: actualizado, error: errUp } = await supabase.rpc('admin_agregar_estrella', { p_cliente_id: c.id });
        if(errUp){ showMsg(msgAdminBuscar, 'No se pudo asignar la estrella.', 'error'); e.target.disabled = false; return; }
        c.estrellas = actualizado.estrellas;
        row.querySelector('p').textContent = c.email + ' · ' + c.estrellas + ' / ' + ESTRELLAS_REQUERIDAS + ' estrellas';
        e.target.disabled = false;
      });
      cont.appendChild(row);
    });
  });

})();
</script>
</body>
</html>
